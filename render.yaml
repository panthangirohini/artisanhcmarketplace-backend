# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Values marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: artisanhcmarketplace-backend
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Cloud MySQL (e.g. Aiven): jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://artisan-handcraft.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Add RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET in the dashboard later if you enable real payments
