# Local development profile — embedded H2 database stored in ./data, no MySQL needed.
# Run with:  .\mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/artisan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
