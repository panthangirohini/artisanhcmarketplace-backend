spring.application.name=artisanmarketplace

# MySQL (use env vars in Render)
# For local development without MySQL, run with the "local" profile (see application-local.properties)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/artisan_marketplace?createDatabaseIfNotExist=true}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# Upload limits (uploaded images are served from ./uploads at /uploads/** — see WebConfig)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Frontend origins allowed to call the API (comma-separated; add your deployed frontend URL)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Seed categories, sample products and an admin account on first start
app.seed.enabled=${SEED_DATA:true}
app.admin.email=${ADMIN_EMAIL:admin@artisan.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Razorpay — get these from dashboard.razorpay.com → Settings → API Keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_XXXXXXXXXXXXXXXX}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:XXXXXXXXXXXXXXXXXXXXXXXX}

# JWT (must be at least 32 characters)
jwt.secret=${JWT_SECRET:artisan-marketplace-super-secret-key-2024-do-not-expose}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
